# GoreeCloud dependency review gate
#
# This workflow intentionally does not depend on GitHub Dependency Graph.
# Dependency Graph is currently unavailable for this repository, and GoreeCloud
# governance does not permit treating that provider-configuration failure as a
# passing security gate. Instead, the exact pull-request head is reviewed with
# repository-native dependency integrity and vulnerability checks. A failed
# module verification, reachable Go vulnerability, production Electron audit,
# or lockfile installation is a failing dependency-review result.
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Record candidate and dependency-manifest evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "pull_request=${{ github.event.pull_request.number }}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "head_ref=${{ github.event.pull_request.head.ref }}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
          } > dependency-evidence/candidate.txt

          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

          git diff --name-only             "${{ github.event.pull_request.base.sha }}"             "${{ github.event.pull_request.head.sha }}"             --             go.mod             go.sum             app/package.json             app/package-lock.json             > dependency-evidence/changed-manifests.txt

          sha256sum             go.mod             go.sum             app/package.json             app/package-lock.json             > dependency-evidence/dependency-inputs.sha256

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Verify Go module graph
        shell: bash
        run: |
          set -euo pipefail
          go version | tee dependency-evidence/go-toolchain.txt
          go mod verify | tee dependency-evidence/go-mod-verify.txt
          go list -m all > dependency-evidence/go-modules.txt

      - name: Check reachable Go vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./... 2>&1 | tee dependency-evidence/govulncheck.txt

      - name: Verify Electron production lockfile
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --omit=dev 2>&1 | tee ../dependency-evidence/npm-ci-production.txt

      - name: Validate Electron production dependency tree
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ls --omit=dev --all --json \
            | tee ../dependency-evidence/npm-tree-production.json

      - name: Audit Electron production dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high --json \
            | tee ../dependency-evidence/npm-audit-production.json

      - name: Retain dependency-review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-evidence-${{ github.run_id }}
          path: dependency-evidence/
          if-no-files-found: error
          retention-days: 30
