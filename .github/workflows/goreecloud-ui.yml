name: GoreeCloud UI

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'internal/server/**'
      - 'docs/goreecloud/GLAZE_UI_CONFORMANCE.md'
      - 'scripts/validate_goreecloud_ui.py'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/goreecloud-ui.yml'
  push:
    branches: [ master, 'agent/**' ]
    paths:
      - 'internal/server/**'
      - 'docs/goreecloud/GLAZE_UI_CONFORMANCE.md'
      - 'scripts/validate_goreecloud_ui.py'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/goreecloud-ui.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay-tests:
    name: GoreeCloud presentation overlay
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Verify module graph
        run: go mod verify

      - name: Validate Glaze UI source contract
        run: python3 scripts/validate_goreecloud_ui.py

      - name: Test server package
        run: go test ./internal/server/...
