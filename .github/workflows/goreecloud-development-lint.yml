name: GoreeCloud Development Lint

on:
  pull_request:
    branches:
      - agent/goreecloud-foundation
    paths:
      - "internal/goreecloud/**"
      - ".golangci.yml"
      - ".github/workflows/goreecloud-development-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GoreeCloud-owned development code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Lint Windows targets
        run: make lint-windows

      - name: Check locks
        run: make check-locks

      - name: Check formatting
        run: make check-prettier
