name: GoreeCloud Security

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, 'agent/**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Wardveil source security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Record deterministic dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          go version > security-evidence/go-toolchain.txt
          go list -m all > security-evidence/go-modules.txt
          node --version > security-evidence/node-version.txt
          npm --version > security-evidence/npm-version.txt
          sha256sum go.mod go.sum app/package.json app/package-lock.json > security-evidence/dependency-inputs.sha256

      - name: Verify module graph
        run: go mod verify

      - name: Validate Wardveil Security contract
        run: python3 scripts/validate_goreecloud_security.py

      - name: Test authentication privacy and cookie boundary
        run: go test ./internal/server/... -run '^TestGoreeCloud' -count=1

      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Audit production Electron dependencies
        working-directory: app
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Retain security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wardveil-security-evidence-${{ github.run_id }}
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30
