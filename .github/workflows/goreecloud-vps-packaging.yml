name: GoreeCloud VPS Packaging

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "deploy/docker/**"
      - "deploy/systemd/**"
      - ".github/workflows/goreecloud-vps-packaging.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate governed VPS CLI packaging
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n deploy/docker/entrypoint.sh
          sh -n deploy/docker/build-image.sh
          sh -n deploy/docker/goreecloud-backup.sh
          sh -n deploy/docker/vps-preflight.sh

      - name: Validate Compose rendering
        shell: bash
        env:
          GOREECLOUD_BACKUP_IMAGE: ghcr.io/goreecloud/goreecloud-backup:0.0.0-ci@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GOREECLOUD_BACKUP_UID: "10001"
          GOREECLOUD_BACKUP_GID: "10001"
          GOREECLOUD_BACKUP_CONFIG_DIR: /tmp/goreecloud-backup/config
          GOREECLOUD_BACKUP_CACHE_DIR: /tmp/goreecloud-backup/cache
          GOREECLOUD_BACKUP_LOG_DIR: /tmp/goreecloud-backup/logs
          GOREECLOUD_BACKUP_TMP_DIR: /tmp/goreecloud-backup/tmp
          GOREECLOUD_BACKUP_RESTORE_DIR: /tmp/goreecloud-backup/restore
          GOREECLOUD_BACKUP_SFTP_KEY_FILE: /tmp/goreecloud-backup/secrets/kopia-sftp-ed25519
          GOREECLOUD_BACKUP_SFTP_KNOWN_HOSTS_FILE: /tmp/goreecloud-backup/secrets/kopia-sftp-known_hosts
          GOREECLOUD_BACKUP_REPOSITORY_PASSWORD_FILE: /tmp/goreecloud-backup/secrets/repository-password
        run: |
          set -euo pipefail
          mkdir -p             /tmp/goreecloud-backup/config             /tmp/goreecloud-backup/cache             /tmp/goreecloud-backup/logs             /tmp/goreecloud-backup/tmp             /tmp/goreecloud-backup/restore             /tmp/goreecloud-backup/secrets
          printf '%s\n' ci-only > /tmp/goreecloud-backup/secrets/repository-password
          printf '%s\n' ci-only > /tmp/goreecloud-backup/secrets/kopia-sftp-ed25519
          printf '%s\n' ci-only > /tmp/goreecloud-backup/secrets/kopia-sftp-known_hosts

          docker compose             --file deploy/docker/compose.yaml             config > /tmp/goreecloud-backup-compose.yaml

      - name: Enforce production-safe CLI invariants
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq '^[[:space:]]*privileged:[[:space:]]*true' deploy/docker/compose.yaml; then
            echo "privileged containers are prohibited" >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*(ports|expose):' deploy/docker/compose.yaml; then
            echo "the CLI replacement must not publish or expose a service port" >&2
            exit 1
          fi

          if grep -q -- '--disable-csrf-token-checks' deploy/docker/compose.yaml deploy/docker/Dockerfile deploy/docker/*.sh; then
            echo "CSRF bypass must not appear in production packaging" >&2
            exit 1
          fi

          if grep -q -- 'server start' deploy/docker/compose.yaml deploy/docker/Dockerfile deploy/docker/*.sh; then
            echo "the initial VPS replacement must remain an on-demand CLI workload" >&2
            exit 1
          fi

          if grep -Eq 'image:.*:latest([@"[:space:]]|$)' deploy/docker/compose.yaml; then
            echo "mutable latest image references are prohibited" >&2
            exit 1
          fi

          grep -q 'restart: "no"' deploy/docker/compose.yaml
          grep -q 'cap_drop:' deploy/docker/compose.yaml
          grep -q 'no-new-privileges:true' deploy/docker/compose.yaml
          grep -q 'read_only: true' deploy/docker/compose.yaml
          grep -q 'GOREECLOUD_BACKUP_IMAGE:?' deploy/docker/compose.yaml
          grep -q 'GO_BUILD_IMAGE' deploy/docker/Dockerfile
          grep -q 'RUNTIME_IMAGE' deploy/docker/Dockerfile
          grep -q 'compose.sources.yaml' deploy/docker/goreecloud-backup.sh
          grep -q 'repository status' deploy/docker/goreecloud-backup.sh
          grep -q 'snapshot create /source' deploy/docker/goreecloud-backup.sh

      - name: Validate systemd schedule contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Type=oneshot$' deploy/systemd/goreecloud-backup.service
          grep -q '^OnCalendar=.*00,06,12,18:00:00$' deploy/systemd/goreecloud-backup.timer
          grep -q '^RandomizedDelaySec=5m$' deploy/systemd/goreecloud-backup.timer
          grep -q '^Persistent=true$' deploy/systemd/goreecloud-backup.timer
